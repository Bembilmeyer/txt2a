# Конфигурация аудиокниг

tts:
  model: "silero"                    # silero или piper
  voice: "baya"                      # aidar, baya, kseniya, xenia, eugene
  sample_rate: 48000
  speed: 1.0                         # 0.8–1.3

processing:
  chunk_size: 350                    # символов на один чанк синтеза
  max_sentence_length: 400
  pause_between_paragraphs: 400      # ms
  pause_between_chapters: 800        # ms

output:
  format: "m4b"                      # m4b или mp3
  bitrate: "96k"
  normalize: true
  remove_silence: true

paths:
  books_dir: "books"
  output_dir: "output"
  temp_dir: "temp"